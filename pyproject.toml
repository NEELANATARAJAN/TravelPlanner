[project]
name = "travelplanner"
version = "0.1.0"
description = "AI to develop your dream's plan"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Neela Natarajan" }]
license = "LicenseRef-Proprietary"
dependencies = [
    "langgraph==1.2.10",
    "ipykernel==7.3.0",
    "structlog==26.1.0",
    "tavily-python==0.7.27",
    "wikipedia==1.4.0",
    "langchain-community==0.4.2",
    "langchain-core==1.5.3",
    "langchain-google-genai==4.3.2",
    "langchain-groq==1.1.3",
    "python-docx==1.2.0",
    "reportlab==5.0.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    "sqlalchemy==2.0.51",
    "bcrypt==5.0.0",
    "passlib==1.7.4",
    "python-multipart==0.0.32",
    "python-dotenv>=1.2.2",
    "voyageai>=0.5.0",
    "anthropic==1.7.0",
    "pinecone==10.0.0",
    "openai==1.108.1",
]

[project.scripts]
travelplanner = "travelplanner.main:main"
travelplanner-ingest = "travelplanner.pipeline.ingest:main"
travelplanner-scheduler = "travelplanner.pipeline.scheduler:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
